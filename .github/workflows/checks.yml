name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aftermath
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: aftermath
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aftermath -d aftermath"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AFTERMATH_DATABASE_URL: postgresql+psycopg://aftermath:local-only@localhost:5432/aftermath
      AFTERMATH_TEST_DATABASE_URL: postgresql+psycopg://aftermath:local-only@localhost:5432/aftermath
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check src tests migrations
      - run: uv run ruff format --check src tests migrations
      - run: uv run mypy src
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
