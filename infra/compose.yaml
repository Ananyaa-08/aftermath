services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aftermath
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: aftermath
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - aftermath_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aftermath -d aftermath"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  aftermath_pg:
